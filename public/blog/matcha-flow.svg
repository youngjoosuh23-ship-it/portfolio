<svg viewBox="0 0 1400 1400" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8a8f98" />
    </marker>
  </defs>

  <rect width="1400" height="1400" fill="none" />

  <!-- section labels -->
  <text x="20" y="115" fill="#9aa0a8" font-size="15" font-weight="600" transform="rotate(-90 20 115)">발견 ①</text>
  <text x="20" y="315" fill="#9aa0a8" font-size="15" font-weight="600" transform="rotate(-90 20 315)">탐색 ②</text>
  <text x="20" y="650" fill="#9aa0a8" font-size="15" font-weight="600" transform="rotate(-90 20 650)">매칭 ③</text>
  <text x="20" y="845" fill="#9aa0a8" font-size="15" font-weight="600" transform="rotate(-90 20 845)">첫 진행 ④</text>
  <text x="20" y="1045" fill="#9aa0a8" font-size="15" font-weight="600" transform="rotate(-90 20 1045)">사후 관리 ⑤</text>

  <!-- dividers -->
  <line x1="40" y1="210" x2="1360" y2="210" stroke="#e2e5e9" stroke-width="1.5" stroke-dasharray="4 5" />
  <line x1="40" y1="410" x2="1360" y2="410" stroke="#e2e5e9" stroke-width="1.5" stroke-dasharray="4 5" />
  <line x1="40" y1="740" x2="1360" y2="740" stroke="#e2e5e9" stroke-width="1.5" stroke-dasharray="4 5" />
  <line x1="40" y1="940" x2="1360" y2="940" stroke="#e2e5e9" stroke-width="1.5" stroke-dasharray="4 5" />

  <!-- ROW 1: 발견 -->
  <g>
    <rect x="60" y="40" width="340" height="140" rx="16" fill="#d7f4e3" stroke="#34a37a" stroke-width="1.5" />
    <text x="230" y="100" text-anchor="middle" fill="#0f5132" font-size="19" font-weight="700">지도 진입</text>
    <text x="230" y="128" text-anchor="middle" fill="#1f7a53" font-size="14">현재 위치 기반</text>
    <text x="230" y="148" text-anchor="middle" fill="#1f7a53" font-size="14">활성 카페 핀 표시</text>

    <rect x="460" y="40" width="340" height="140" rx="16" fill="#d7f4e3" stroke="#34a37a" stroke-width="1.5" />
    <text x="630" y="100" text-anchor="middle" fill="#0f5132" font-size="19" font-weight="700">실시간 필터</text>
    <text x="630" y="128" text-anchor="middle" fill="#1f7a53" font-size="14">언어・분야・목적</text>
    <text x="630" y="148" text-anchor="middle" fill="#1f7a53" font-size="14">지금 가능 여부</text>

    <rect x="860" y="40" width="340" height="140" rx="16" fill="#d7f4e3" stroke="#34a37a" stroke-width="1.5" />
    <text x="1030" y="100" text-anchor="middle" fill="#0f5132" font-size="19" font-weight="700">카페 선택</text>
    <text x="1030" y="128" text-anchor="middle" fill="#1f7a53" font-size="14">Place ID 연동</text>
    <text x="1030" y="148" text-anchor="middle" fill="#1f7a53" font-size="14">바텀 시트 오픈</text>
  </g>

  <!-- ROW 2: 탐색 -->
  <g>
    <rect x="60" y="240" width="340" height="140" rx="16" fill="#e2ddf9" stroke="#7c6fd6" stroke-width="1.5" />
    <text x="230" y="300" text-anchor="middle" fill="#3b2f7a" font-size="19" font-weight="700">카페 상세</text>
    <text x="230" y="328" text-anchor="middle" fill="#5c4fae" font-size="14">구글 리뷰 + 현재</text>
    <text x="230" y="348" text-anchor="middle" fill="#5c4fae" font-size="14">체크인 인원 표시</text>

    <rect x="460" y="240" width="340" height="140" rx="16" fill="#e2ddf9" stroke="#7c6fd6" stroke-width="1.5" />
    <text x="630" y="300" text-anchor="middle" fill="#3b2f7a" font-size="19" font-weight="700">프로필 카드 탐색</text>
    <text x="630" y="328" text-anchor="middle" fill="#5c4fae" font-size="14">언어・분야・스타일</text>
    <text x="630" y="348" text-anchor="middle" fill="#5c4fae" font-size="14">커피챗 목적 확인</text>

    <rect x="860" y="240" width="340" height="140" rx="16" fill="#e2ddf9" stroke="#7c6fd6" stroke-width="1.5" />
    <text x="1030" y="300" text-anchor="middle" fill="#3b2f7a" font-size="19" font-weight="700">관심 대상 발견</text>
    <text x="1030" y="328" text-anchor="middle" fill="#5c4fae" font-size="14">커피챗 신청 버튼</text>
    <text x="1030" y="348" text-anchor="middle" fill="#5c4fae" font-size="14">짧은 소개 메시지</text>
  </g>

  <!-- ROW 3: 매칭 알림 -->
  <rect x="430" y="440" width="540" height="110" rx="16" fill="#fbe6c6" stroke="#e0932e" stroke-width="1.5" />
  <text x="700" y="490" text-anchor="middle" fill="#7a4a06" font-size="19" font-weight="700">상대방 알림 수신</text>
  <text x="700" y="516" text-anchor="middle" fill="#a5651b" font-size="14">프로필 미리보기 + 수락 / 정중히 거절</text>

  <!-- ROW 4: 매칭 결과 -->
  <rect x="60" y="590" width="340" height="120" rx="16" fill="#dcf3df" stroke="#4caf60" stroke-width="1.5" />
  <text x="230" y="645" text-anchor="middle" fill="#1f6b2c" font-size="19" font-weight="700">매칭 성사</text>
  <text x="230" y="672" text-anchor="middle" fill="#2f8a3f" font-size="14">상호 프로필 공개 · 제안 주제 확인</text>

  <rect x="460" y="590" width="740" height="120" rx="16" fill="#e9e9e6" stroke="#9c9c94" stroke-width="1.5" />
  <text x="830" y="645" text-anchor="middle" fill="#55554d" font-size="19" font-weight="700">정중한 거절</text>
  <text x="830" y="672" text-anchor="middle" fill="#75756b" font-size="14">익명 처리, 30분 후 재신청 가능</text>

  <!-- ROW 5: 첫 진행 -->
  <g>
    <rect x="60" y="770" width="340" height="140" rx="16" fill="#fbdedb" stroke="#d9695a" stroke-width="1.5" />
    <text x="230" y="830" text-anchor="middle" fill="#7a2b1f" font-size="19" font-weight="700">체크인</text>
    <text x="230" y="858" text-anchor="middle" fill="#9c3f2e" font-size="14">카페 도착 확인</text>
    <text x="230" y="878" text-anchor="middle" fill="#9c3f2e" font-size="14">상태 → 대화 가능</text>

    <rect x="460" y="770" width="340" height="140" rx="16" fill="#fbdedb" stroke="#d9695a" stroke-width="1.5" />
    <text x="630" y="830" text-anchor="middle" fill="#7a2b1f" font-size="19" font-weight="700">인앱 채팅</text>
    <text x="630" y="858" text-anchor="middle" fill="#9c3f2e" font-size="14">주제 · 장소 조율</text>
    <text x="630" y="878" text-anchor="middle" fill="#9c3f2e" font-size="14">짧은 소개 교환</text>

    <rect x="860" y="770" width="340" height="140" rx="16" fill="#fbdedb" stroke="#d9695a" stroke-width="1.5" />
    <text x="1030" y="830" text-anchor="middle" fill="#7a2b1f" font-size="19" font-weight="700">오프라인 만남</text>
    <text x="1030" y="858" text-anchor="middle" fill="#9c3f2e" font-size="14">실제 커피챗 진행</text>
    <text x="1030" y="878" text-anchor="middle" fill="#9c3f2e" font-size="14">앱은 백그라운드</text>
  </g>

  <!-- ROW 6: 사후 관리 -->
  <g>
    <rect x="60" y="970" width="340" height="140" rx="16" fill="#dbe7fb" stroke="#5f8fd9" stroke-width="1.5" />
    <text x="230" y="1030" text-anchor="middle" fill="#1d3f73" font-size="19" font-weight="700">후기 피드백</text>
    <text x="230" y="1058" text-anchor="middle" fill="#2f5993" font-size="14">카페 + 상대방</text>
    <text x="230" y="1078" text-anchor="middle" fill="#2f5993" font-size="14">간단 이모지 평가</text>

    <rect x="460" y="970" width="340" height="140" rx="16" fill="#dbe7fb" stroke="#5f8fd9" stroke-width="1.5" />
    <text x="630" y="1030" text-anchor="middle" fill="#1d3f73" font-size="19" font-weight="700">연결 유지</text>
    <text x="630" y="1058" text-anchor="middle" fill="#2f5993" font-size="14">팔로우 or 링크드인</text>
    <text x="630" y="1078" text-anchor="middle" fill="#2f5993" font-size="14">연락처 교환 옵션</text>

    <rect x="860" y="970" width="340" height="140" rx="16" fill="#dbe7fb" stroke="#5f8fd9" stroke-width="1.5" />
    <text x="1030" y="1030" text-anchor="middle" fill="#1d3f73" font-size="19" font-weight="700">재방문 유도</text>
    <text x="1030" y="1058" text-anchor="middle" fill="#2f5993" font-size="14">단골 카페 저장</text>
    <text x="1030" y="1078" text-anchor="middle" fill="#2f5993" font-size="14">주간 추천 알림</text>
  </g>

  <!-- ROW 7: 평판 -->
  <rect x="60" y="1250" width="1140" height="100" rx="16" fill="#cdf1e7" stroke="#35a884" stroke-width="1.5" />
  <text x="630" y="1295" text-anchor="middle" fill="#0e5c46" font-size="19" font-weight="700">평판 · 이력 누적</text>
  <text x="630" y="1322" text-anchor="middle" fill="#1a7d61" font-size="14">신뢰 프로필 강화 → 더 많은 매칭 기회</text>

  <!-- arrows: row1 horizontal -->
  <line x1="400" y1="110" x2="455" y2="110" stroke="#8a8f98" stroke-width="2.5" marker-end="url(#arrow)" />
  <line x1="800" y1="110" x2="855" y2="110" stroke="#8a8f98" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- row1 box3 -> row2 box2 (elbow) -->
  <polyline points="1030,180 1030,210 630,210 630,235" fill="none" stroke="#8a8f98" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- row2 horizontal -->
  <line x1="400" y1="310" x2="455" y2="310" stroke="#8a8f98" stroke-width="2.5" marker-end="url(#arrow)" />
  <line x1="800" y1="310" x2="855" y2="310" stroke="#8a8f98" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- row2 box3 -> row3 alert (elbow) -->
  <polyline points="1030,380 1030,410 700,410 700,435" fill="none" stroke="#8a8f98" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- row3 alert -> matched / declined -->
  <polyline points="700,550 700,575 230,575 230,585" fill="none" stroke="#8a8f98" stroke-width="2.5" marker-end="url(#arrow)" />
  <polyline points="700,550 700,575 830,575 830,585" fill="none" stroke="#8a8f98" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- matched -> checkin -->
  <line x1="230" y1="710" x2="230" y2="765" stroke="#8a8f98" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- row5 horizontal -->
  <line x1="400" y1="840" x2="455" y2="840" stroke="#8a8f98" stroke-width="2.5" marker-end="url(#arrow)" />
  <line x1="800" y1="840" x2="855" y2="840" stroke="#8a8f98" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- offline meetup -> connect (elbow) -->
  <polyline points="1030,910 1030,940 630,940 630,965" fill="none" stroke="#8a8f98" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- reputation loop -->
  <line x1="230" y1="1250" x2="230" y2="1115" stroke="#9aa3ad" stroke-width="2" />
  <line x1="630" y1="1250" x2="630" y2="1115" stroke="#8a8f98" stroke-width="2.5" marker-end="url(#arrow)" />
  <line x1="1030" y1="1250" x2="1030" y2="1115" stroke="#9aa3ad" stroke-width="2" />
</svg>
